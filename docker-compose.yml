version: '3.8'
services:
  minio:
    image: minio/minio
    container_name: quantara-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Create default buckets automatically
  minio-create-buckets:
    image: minio/mc
    container_name: quantara-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/market-data;
      /usr/bin/mc mb myminio/processed-parquet;
      /usr/bin/mc anonymous set public myminio/market-data;
      exit 0;
      "

volumes:
  minio_data:
