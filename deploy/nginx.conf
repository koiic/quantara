# ==============================================================================
# QUANTARA QUANT PLATFORM - PRODUCTION NGINX CONFIGURATION
# Supports both:
# 1. Raw Public IP (HTTP Port 80)
# 2. Custom Domain (HTTPS Port 443 with SSL)
# ==============================================================================

# --- Upstream Services ---
upstream backend_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream yjs_websocket {
    server 127.0.0.1:1234;
}

upstream streamlit_studio {
    server 127.0.0.1:8501;
}

# --- HTTP Server (Raw Public IP or fallback) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/quantara/dpp/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # React Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI REST & WebSocket APIs
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Yjs Multiplayer WebSocket
    location /yjs-ws/ {
        proxy_pass http://yjs_websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Streamlit Executive Dashboard
    location /streamlit/ {
        proxy_pass http://streamlit_studio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
